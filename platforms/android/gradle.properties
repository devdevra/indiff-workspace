# Measured low-memory build settings; heap is not total process-tree RSS.
org.gradle.jvmargs=-Xms32m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -XX:ActiveProcessorCount=1 -Xss256k -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
