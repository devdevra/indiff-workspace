<!doctype html>
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="description" content="INDIFF 원본의 파일 트리·탭·분할·보드 조작을 보존하는 로컬 UI 교정 작업본. AI와 외부 실행은 연결되어 있지 않습니다."><title>INDIFF · local UI correction</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Ctext x='6' y='23' font-size='24' fill='%23fafafa'%3Ei.%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./styles.css"></head>
<body><a class="skip" href="#panes">본문으로 이동</a>
<div class="layout"><aside class="lnb" aria-label="프로젝트 파일 탐색기"><div class="lnb-top"><button class="icon-button sidebar-toggle" aria-label="파일 탐색기 접기" title="파일 탐색기 접기"></button><button class="icon-button" id="focus-search" aria-label="파일 검색" title="파일 검색"></button><span class="spacer"></span><button class="icon-button" id="open-about" aria-label="구현 범위와 실행 안내" title="구현 범위와 실행 안내"></button></div><div class="project-heading"><b>Project</b><span class="spacer"></span><button class="icon-button" id="new-file" aria-label="새 문서" title="새 문서"></button><button class="icon-button" id="import-file" aria-label="문서 가져오기" title="문서 가져오기"></button></div><div class="tree" id="file-tree"></div><div class="lnb-footer"><button id="export-backup">작업공간 백업</button><button id="import-backup">복원</button><span class="local-note">원본 UI 교정 중 · AI 미연결 · 네이티브 소스 검수</span></div></aside><div id="sidebar-resize" class="sidebar-resize" role="separator" aria-orientation="vertical" aria-label="파일 탐색기 너비" tabindex="0"></div><main id="panes" class="panes" tabindex="-1"></main></div>
<button id="sidebar-rail" class="icon-button" aria-label="파일 탐색기 열기" title="파일 탐색기 열기"></button>
<nav id="mobile-panes" aria-label="모바일 패널 선택"></nav><footer class="app-bar"><span id="status-path" class="grow">빈 패널</span><span id="save-status" role="status">로컬 저장 준비</span><span class="connection-status">AI 미연결</span><button id="status-about" title="원본 UI 교정 중 · AI 미연결 · 네이티브 소스 검수">플랫폼 소스 검수 · 설치 빌드 미검증</button></footer>
<button id="indi-orb" class="indi-orb" aria-label="로컬 작업 상태 보기" title="로컬 작업 상태 · AI 미연결"><span class="orb-face"><i></i><i></i></span></button><section id="indi-card" hidden aria-label="로컬 작업 상태"><div><b>로컬 작업 상태</b><button id="close-indi" class="icon-button" aria-label="작업 상태 닫기">×</button></div><p>AI는 연결되어 있지 않습니다. 문서·팀 메모·보드는 현재 기기에 저장됩니다. 설치 빌드와 기기 연결은 검수 중입니다.</p><p id="indi-run-status">진행 중인 로컬 실행 없음</p><button id="indi-open-board">보드 열기</button></section>
<dialog id="search-dialog" aria-label="문서 찾기"><header><b>찾기</b><button id="search-close" class="icon-button" aria-label="찾기 닫기">×</button></header><input id="file-search" type="search" placeholder="파일 이름이나 내용 찾기…" aria-label="파일과 내용 검색"><div id="search-results"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><dialog id="edit-dialog"><form id="edit-form"><header><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon-button" aria-label="닫기">×</button></header><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><footer><button type="button" id="dialog-cancel">취소</button><button type="submit" class="primary">저장</button></footer></form></dialog>
<input id="text-import" type="file" accept=".md,.markdown,.txt,.workflow.json,.json,.yaml,.yml" multiple hidden><input id="backup-import" type="file" accept=".json,application/json" hidden><script type="module" src="./app.js"></script><noscript>이 작업공간을 사용하려면 JavaScript가 필요합니다.</noscript></body></html>
